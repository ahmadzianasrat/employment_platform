<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrite rules (unlike Apache's
      // .htaccess), so a direct link to a client-side route like
      // /jobs/some-id would normally 404. GitHub Pages serves this file
      // for any unmatched path — we encode the intended path into a query
      // string and redirect to index.html, which decodes it back on load
      // (see the script in index.html) so React Router ends up on the
      // right route with the URL bar showing the original, clean path.
      var path = location.pathname + location.search + location.hash;
      location.replace('/?redirect=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
