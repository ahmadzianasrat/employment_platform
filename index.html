    <script>
      // Reverses the 404.html redirect trick: if we arrived here via a
      // GitHub Pages fallback redirect, restore the original URL (without
      // the query string) before React Router mounts, so the address bar
      // shows the clean route and the app renders the right page.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
