<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employment Platform</title>
    <script>
      // Reverses the 404.html redirect trick: if we arrived here via a
      // GitHub Pages fallback redirect, restore the original URL (without
      // the query string) before React Router mounts, so the address bar
      // shows the clean route and the app renders the right page.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
